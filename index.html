"use strict";
/* =====================================================================

const SUPABASE_ANON_KEY = "sb_publishable_OCCYtuz890QNDy9GpkBarg_CqjhCbt5";
/* مفتاح VAPID العام لإشعارات الدفع (Web Push) — صاحب الموقع بيحط

   وصفحة الأدمن بتعرض خطوات التشغيل — المفتاح العام آمن يظهر هنا
   (هو معمول للعلن أصلًا)، أما المفتاح الخاص فمش بيتحط في أي ملف
   موقع: بيتحفظ سرًّا في الدالة وفي إعدادات المنصة الرئيسية بس */
const VAPID_PUBLIC_KEY = "BEK_DTMNtKXqXoo25weSO5V9aaw4UsYioP5b2w8Ytg0dwEMIEHU0a3tBEA5cZU2tOrxqVLtoAMN4YrsUK-9fYsw";
/* دخول الأدمن بالكود بس — من غير إيميل ولا باسورد في الصفحة.
   ملحوظة أمان: الكود نفسه مش مكتوب في الملف ده خالص — التحقق بيتم
   على السيرفر عبر دالة Supabase RPC اسمها check_admin_code (قسم 6 في
   supabase-setup.sql)، فالكود لا يصل للمتصفح أبدًا. وبعد ما الكود
   يطلع صح، الصفحة بتسجّل دخول Supabase Auth تلقائيًا بحساب الأدمن
   المشترك (لأن الكتابة مقفولة بـ RLS على authenticated): الإيميل
   بييجي من دالة admin_signin_email (قسم 12) اللي بترجّعه بس لو
   الكود صح، وباسورد الحساب مضبوطة على السيرفر على نفس قيمة الكود
   (مزامنة قسم 12) — فلا الكود ولا الإيميل ولا أي باسورد مكتوب هنا. */
const LIVE = () => Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);

/* المواد الثمانية — مرآة لجدول subjects (وتُقرأ من الجدول نفسه عند تفعيل Supabase) */
let SUBJECTS=[
 {slug:"neuro-anatomy",en:"Neuro-anatomy",ar:"تشريح الجهاز العصبي",icon:"🧠"},
 {slug:"biomechanics",en:"Biomechanics",ar:"الميكانيكا الحيوية",icon:"🦴"},
 {slug:"electro-therapy",en:"Electro-therapy",ar:"العلاج بالكهرباء",icon:"⚡"},
 {slug:"physiology-3",en:"Physiology 3",ar:"فسيولوجيا ٣",icon:"🫀"},
 {slug:"muscle-test",en:"Muscle Test",ar:"اختبار العضلات",icon:"💪"},
 {slug:"hydro-therapy",en:"Hydro-therapy",ar:"العلاج المائي",icon:"💧"},
 {slug:"biochemistry-2",en:"Biochemistry 2",ar:"الكيمياء الحيوية ٢",icon:"🧪"},
 {slug:"public-health",en:"Public Health",ar:"الصحة العامة",icon:"🏥"}
];
const TABLE_FOR_KIND={video:"videos",recording:"recordings",file:"files",summary:"summaries",question:"questions"};
const KIND_ICONS={video:"🎬",recording:"🎙️",file:"📁",summary:"📝",question:"❓"};
function kindNameStatic(i){const n={video:"فيديو",recording:"ريكورد",file:"ملف",summary:"ملخص",question:"سؤال وجواب"}[i.kind]||i.kind;
  return (i.kind==="file"||i.kind==="recording"||i.kind==="summary")?n+" "+(i.file_category==="section"?"سكشن":"محاضرة"):n}
const LS_KEY="sahli-physio-local-items";
/* السيمسترات: سيمستر 1 افتراضيًا (مواده الثمانية)، وأي سيمستر/مادة يضيفه
   الأدمن من النسخة دي بيتحفظ محليًا على جهازه وبيندمج مع الحي */
let SEMESTERS=[{slug:"semester-1",ar:"سيمستر 1",en:"Semester 1",term:"الترم الأول"}];
const SUBJECT_IMAGES={"neuro-anatomy":"assets/neuro.webp","biomechanics":"assets/biomechanics.webp","electro-therapy":"assets/electro.webp","physiology-3":"assets/physiology.webp","muscle-test":"assets/muscle.webp","hydro-therapy":"assets/hydro.webp","biochemistry-2":"assets/biochem.webp","public-health":"assets/public-health.webp"};
SUBJECTS=SUBJECTS.map(s=>({...s,semester:"semester-1",color:"#0F766E"}));
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const allSemesters=()=>{const extra=lsGet("sahli-semesters",[]);const base=SEMESTERS.filter(s=>!extra.some(e=>e.slug===s.slug));return [...base,...extra]};
const allSubjects=()=>{const extra=lsGet("sahli-local-subjects",[]);const base=SUBJECTS.filter(s=>!extra.some(e=>e.slug===s.slug));return [...base,...extra]};
const cohortLabel=()=>lsGet("sahli-cohort","سنة تانية · دفعة PT13");
const adminName=()=>{try{return sessionStorage.getItem("sahli-admin-name")||""}catch{return""}};
/* موقع الزائر التقريبي: المتصفح نفسه بيحدد عنوانه العام والمدينة/الدولة
   عبر خدمة IP-geolocation مجانية (ipwho.is، وبديلها ipapi.co) مرة واحدة
   في الجلسة وبيخزّن النتيجة في sessionStorage. أي فشل (حجب/شبكة) بيرجّع
   قيمًا فارغة وبتتسجل الزيارة من غير موقع بدل ما تضيع. */
let geoPromise=null;
function visitorGeo(){
  if(geoPromise)return geoPromise;
  geoPromise=(async()=>{
    const empty={ip:null,city:null,country:null};
    try{const c=sessionStorage.getItem("sahli-geo");if(c){const p=JSON.parse(c);return{ip:p.ip||null,city:p.city||null,country:p.country||null}}}catch(e){}
    const fj=async(u)=>{const ct=new AbortController();const t=setTimeout(()=>ct.abort(),3000);try{const r=await fetch(u,{signal:ct.signal});if(!r.ok)return null;return await r.json()}catch(e){return null}finally{clearTimeout(t)}};
    const s=v=>(typeof v==="string"&&v.trim())?v.trim():null;
    let geo=empty;
    /* ٣ خدمات مجانية بالترتيب: فشل أو تحديد معدل (rate limit) في واحدة
       — بيحصل متقطعًا خصوصًا ورا NAT مشترك — بيجرّب اللي بعدها فورًا */
    const a=await fj("https://ipwho.is/");
    if(a&&a.success!==false&&s(a.ip))geo={ip:s(a.ip),city:s(a.city),country:s(a.country)};
    else{const b=await fj("https://ipapi.co/json/");
      if(b&&s(b.ip))geo={ip:s(b.ip),city:s(b.city),country:s(b.country_name)};
      else{const c=await fj("https://freeipapi.com/api/json/");if(c&&s(c.ipAddress))geo={ip:s(c.ipAddress),city:s(c.cityName),country:s(c.countryName)}}}
    /* النتيجة الفاشلة (من غير IP) لا تُخزَّن — المحاولة الجاية تعيد الطلب */
    if(geo.ip){try{sessionStorage.setItem("sahli-geo",JSON.stringify(geo))}catch(e){}}
    return geo;
  })();
  /* نتيجة فاضية (الخدمة محجوبة/بطيئة) لا تتلزّق طول الجلسة: الزيارة
     الجاية تعيد المحاولة بدل ما كل زيارات الجلسة تطلع «غير متاح» */
  geoPromise.then(g=>{if(!g.ip)geoPromise=null});
  return geoPromise;
}
/* تسجيل زيارة (صفحة + وقت + IP/موقع الزائر من متصفحه) — محليًا + رفع لجدول visits في Supabase.
   التسجيل بيستنى تحديد الموقع بحد أقصى ٢٫٥ ثانية: أول زيارة في الجلسة
   بتحمل الـ IP والمدينة والدولة زي اللي بعدها، ولو الخدمة بطيئة أو
   محجوبة الزيارة تتسجل من غير موقع بدل ما تضيع أو تتأخر */
function logVisit(page){
  const timeout=new Promise(res=>setTimeout(()=>res({ip:null,city:null,country:null}),2500));
  Promise.race([visitorGeo(),timeout]).then(geo=>{
    const v={page,ip:geo.ip,city:geo.city,country:geo.country,created_at:new Date().toISOString()};
    const arr=lsGet("sahli-visits",[]);arr.push(v);lsSet("sahli-visits",arr.slice(-2000));
    if(LIVE()&&sb){sb.from("visits").insert({page,ip:geo.ip,city:geo.city,country:geo.country}).then(()=>{},()=>{})}
  });
}
/* تسجيل نشاط أدمن باسمه — محليًا + محاولة رفع لجدول activity_log */
function logActivity(action,kind,subject_slug,item_title){
  const a={admin_name:adminName()||"أدمن",action,kind:kind||"",subject_slug:subject_slug||"",item_title:String(item_title||"").slice(0,300),created_at:new Date().toISOString()};
  const arr=lsGet("sahli-activity",[]);arr.push(a);lsSet("sahli-activity",arr.slice(-1000));
  if(LIVE()&&sb&&session){sb.from("activity_log").insert({admin_name:a.admin_name,action,kind:a.kind,subject_slug:a.subject_slug,item_title:a.item_title}).then(()=>{},()=>{})}
}
let published=[];            // صفوف موحّدة الشكل من جداول Supabase (أو content.json احتياطيًا)
let examsList=[], anonAll=[], featuresOpen=false, anonAsked=false, homeQuery="";
let sb=null;                 // عميل Supabase
let session=null;            // جلسة الأدمن (Supabase Auth)
let adminUnlocked=false;     // بوابة كود الأدمن (التحقق من السيرفر عبر RPC)
/* رسالة موحّدة لما الكود يفتح الأدمن للعرض لكن جلسة الكتابة مش شغالة */
const WRITE_SESSION_MSG="الكتابة مش مفعّلة لسه: جلسة أدمن Supabase مش شغالة. التفعيل بيتم مرة واحدة بس — نفّذ قسم 12 من ملف supabase-setup.sql في Supabase (SQL Editor)، وبعدين اقفل الأدمن وادخل بالكود من جديد، وهتشتغل الإضافة والتعديل والحذف بالكود بس.";
let view={name:"home"};
let liveInitDone=false, safetyTimer=null, lastAutoRefresh=0;
/* false لحد ما أول تحميل كامل للبيانات يخلص (حي من Supabase أو احتياطي) —
   وطول ما هي false الأقسام اللي بتستنى بيانات بتعرض هيكل تحميل (skeleton)

let dataReady=false;
let semConfirmPending=false;
let announcementText="";
let annPending=null, annConfirmPending=false, annClearPending=false;
let remindOpen=false, rmDelayMin=60, rmUseCustom=false;
let suggestOpen=false;
let semPending=null;
let tab="video", visible=10, editing=null; // editing = {kind,id}
let confirmDeleteKey=null; // (لم يعد مستخدمًا — تأكيد الحذف بقى بنافذة askConfirm الداخلية)
const $app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const localItems=()=>{try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]")}catch{return[]}};
const saveLocal=items=>localStorage.setItem(LS_KEY,JSON.stringify(items));
const allItems=()=>LIVE()?[...published]:[...localItems(),...published];
const bySubject=slug=>allItems().filter(i=>i.subject_slug===slug).sort(byDisplayOrder);
const subj=slug=>allSubjects().find(s=>s.slug===slug)||allSubjects()[0];
const ytId=u=>{const m=String(u||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);return m?m[1]:null};
const tgPost=u=>{const m=String(u||"").match(/(?:t\.me|telegram\.me)\/(?:s\/)?([A-Za-z0-9_]{3,})\/(\d+)/);return (m&&m[1]!=="c")?m[1]+"/"+m[2]:null};

/* الجداول الحية في Supabase بتربط المحتوى بالمادة بمعرّفها (subject_id — uuid)
   مش باسمها (subject_slug)، وجدول الأسئلة أعمدته question/answer.
   الخريطتين دول بيترجموا بين المعرّف والاسم عشان باقي الكود يفضل شغال بالاسم. */
let subjectSlugById={}, subjectIdBySlug={};
const FALLBACK_ICONS={"neuro-anatomy":"🧠","biomechanics":"🦴","electro-therapy":"⚡","physiology-3":"🫀","muscle-test":"💪","hydro-therapy":"💧","biochemistry-2":"🧪","public-health":"🏥"};

/* تحويل صف من جدول متخصص لشكل موحّد */
function unify(kind,row){return {id:row.id,kind,
  subject_slug:row.subject_slug||subjectSlugById[row.subject_id]||"",
  title:row.title||(kind==="question"?String(row.question_text||row.question||"").slice(0,300):""),
  url:row.url||null,file_type:row.file_type||null,file_category:row.file_category||"lecture",description:row.description||null,
  question_text:row.question_text||row.question||null,answer_text:row.answer_text||row.answer||null,

/* مفتاح ترتيب العرض الفعّال: sort_order المحفوظ، ولو لسه مش موجود
   (قبل تنفيذ قسم 17 أو لعنصر قديم) يبقى ‎-id‎ = الأحدث أولًا زي العرض الحالي */
const ordOf=i=>(typeof i.sort_order==="number"&&isFinite(i.sort_order))?i.sort_order:-Number(i.id||0);
const byDisplayOrder=(a,b)=>ordOf(a)-ordOf(b)||(Number(b.id||0)-Number(a.id||0));

async function fetchAllLive(){
  /* كل الجداول بتتجاب بالتوازي في طلب واحد مجمّع (Promise.all) بدل
     الانتظار التسلسلي جدول ورا جدول — أول عرض بييجي أسرع بكتير.
     كل استعلام محمي لوحده: جدول ناقص أو فشل مؤقت يرجّع undefined فالأقسام
     التانية تكمل عادي (الريكوردات/الملخصات قسم 14، الامتحانات والأسئلة
     المجهولة قسم 10 — غياب أي جدول ما يوقفش باقي الموقع). */
  const rows=await Promise.all([
    sb.from("semesters").select("*").order("sort_order"),
    sb.from("subjects").select("*"),
    sb.from("videos").select("*").order("id",{ascending:false}),
    sb.from("recordings").select("*").order("id",{ascending:false}),
    sb.from("files").select("*").order("id",{ascending:false}),
    sb.from("summaries").select("*").order("id",{ascending:false}),
    sb.from("questions").select("*").order("id",{ascending:false}),
    sb.from("site_settings").select("*").eq("key","announcement").maybeSingle(),
    sb.from("exams").select("*").order("exam_date"),
    sb.from("anon_questions").select("*").order("id",{ascending:false}),
    sb.from("anon_replies").select("*").order("id")
  ].map(p=>Promise.resolve(p).then(r=>r&&!r.error?r.data:undefined).catch(()=>undefined)));
  const [sems,subs,v,rec,f,sum,q,st,ex,aq,ar]=rows;
  if(sems&&sems.length)SEMESTERS=sems.map(s=>({slug:s.slug,ar:s.name_ar,en:s.name_en||"",term:s.term_label||""}));
  if(subs&&subs.length){
    subjectSlugById={}; subjectIdBySlug={};
    for(const s of subs){if(s.id&&s.slug){subjectSlugById[s.id]=s.slug;subjectIdBySlug[s.slug]=s.id}}
    SUBJECTS=subs.map(s=>({slug:s.slug,en:s.name_en,ar:s.name_ar,icon:FALLBACK_ICONS[s.slug]||"📘",semester:"semester-1",color:"#0F766E"}));
  }
  published=[
    ...(v||[]).map(r=>unify("video",r)),
    ...(rec||[]).map(r=>unify("recording",r)),
    ...(f||[]).map(r=>unify("file",r)),
    ...(sum||[]).map(r=>unify("summary",r)),
    ...(q||[]).map(r=>unify("question",r))
  ].sort(byDisplayOrder);
  if(st!==undefined)announcementText=(st&&st.value)||"";
  /* جدول الامتحانات (قسم 10 في supabase-setup.sql) */
  if(ex)examsList=ex.map(r=>({id:r.id,title:r.title,exam_type:r.exam_type||"other",subject_slug:r.subject_slug||null,exam_date:r.exam_date,note:r.note||null}));
  /* الأسئلة المجهولة (قسم 10): القراءة العامة للمنشور بس حسب سياسات RLS */
  if(aq){const reps=ar||[];
    anonAll=aq.map(q=>({id:q.id,question_text:q.question_text,answer_text:q.answer_text||null,status:q.status,created_at:q.created_at,replies:reps.filter(r=>r.question_id===q.id).map(r=>({id:r.id,reply_text:r.reply_text,created_at:r.created_at}))}));}
  dataReady=true;
}

async function load(){
  /* تحديد موقع الزائر يبدأ فورًا مع فتح الموقع — قبل تحميل المحتوى —
     عشان أول زيارة في الجلسة تلحق تحمل الـ IP والمدينة زي اللي بعدها */
  visitorGeo();
  if(LIVE()){
    // تحميل مكتبة supabase-js من CDN (ستاتيك بالكامل — مناسب لـ GitHub Pages)
    await new Promise((res,rej)=>{const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
      s.onload=res;s.onerror=rej;document.head.appendChild(s)}).catch(()=>null);
    if(window.supabase){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
      /* البيانات وجلسة الأدمن بيتحمّلوا بالتوازي — أول عرض أسرع */
      const [,sessRes]=await Promise.all([
        fetchAllLive().catch(()=>{published=[]}),
        sb.auth.getSession().catch(()=>null)
      ]);
      session=(sessRes&&sessRes.data&&sessRes.data.session)||null;
      sb.auth.onAuthStateChange((_e,s)=>{session=s; if(view.name==="admin")render()});
      // ===== Supabase Realtime: أي INSERT/UPDATE/DELETE في الجداول التلاتة
      // بيوصل لكل الصفحات المفتوحة في ثوانٍ — من غير تحديث يدوي ولا إعادة نشر
      sb.channel("sahli-live")
        .on("postgres_changes",{event:"*",schema:"public",table:"subjects"},async()=>{await fetchAllLive(); if(view.name!=="admin")render()})
        .on("postgres_changes",{event:"*",schema:"public",table:"semesters"},async()=>{await fetchAllLive(); if(view.name!=="admin")render()})
        .on("postgres_changes",{event:"*",schema:"public",table:"videos"},async()=>{await fetchAllLive(); if(view.name!=="admin")render()})
        .on("postgres_changes",{event:"*",schema:"public",table:"recordings"},async()=>{await fetchAllLive(); if(view.name!=="admin")render()})
        .on("postgres_changes",{event:"*",schema:"public",table:"files"},async()=>{await fetchAllLive(); if(view.name!=="admin")render()})
        .on("postgres_changes",{event:"*",schema:"public",table:"summaries"},async()=>{await fetchAllLive(); if(view.name!=="admin")render()})
        .on("postgres_changes",{event:"*",schema:"public",table:"questions"},async()=>{await fetchAllLive(); if(view.name!=="admin")render()})
        .on("postgres_changes",{event:"*",schema:"public",table:"site_settings"},async()=>{await fetchAllLive(); if(view.name!=="admin")render()})
        .subscribe();
      liveInitDone=true;
      // شبكة أمان: تحديث دوري خفيف لو اتصال Realtime وقع (مرة واحدة بس
      // حتى لو load() اتنادت تاني عند رجوع النت)
      if(!safetyTimer)safetyTimer=setInterval(async()=>{try{const before=JSON.stringify(published);await fetchAllLive();
        if(JSON.stringify(published)!==before&&view.name!=="admin")render()}catch(e){}},30000);
      render(); return;
    }
  }
  // وضع احتياطي (Supabase غير مفعّل): content.json + إضافات محلية
  announcementText=lsGet("sahli-announcement","");
  examsList=lsGet("sahli-exams",[]);
  anonAll=lsGet("sahli-anon-questions",[]);
  try{const r=await fetch("content.json",{cache:"default"}); if(r.ok){const d=await r.json(); published=Array.isArray(d)?d:(d.items||[]);}}catch(e){published=[]}
  dataReady=true;
  render();
}
/* ---------------- تحديث تلقائي أول ما النت يرجع ----------------
   المشكلة اللي بتقابل الطالب على الموبايل: يفتح التطبيق المثبّت والنت
   مقطوع، فيفشل تحميل مكتبة Supabase أو البيانات، والموقع يفضل واقف على
   النسخة الفاضية/القديمة لحد ما يعمل ريفريش يدوي. الحل: أول ما الاتصال
   يرجع (حدث online) أو التطبيق يرجع للواجهة وفيه نت، نعيد التحميل فورًا:
   لو التحميل الحي ما كملش أصلًا نعيد load() كلها (فتُعاد محاولة تحميل

}

const EXAM_TZ="Africa/Cairo";
function cairoOffsetMs(at){const parts=new Intl.DateTimeFormat("en-US",{timeZone:EXAM_TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(at);const get=t=>Number((parts.find(p=>p.type===t)||{}).value||0);const asUTC=Date.UTC(get("year"),get("month")-1,get("day"),get("hour")%24,get("minute"),get("second"));return asUTC-Math.floor(at.getTime()/1000)*1000}
function cairoLocalToIso(local){const dp=(local||"").split("T"),datePart=dp[0]||"",timePart=dp[1]||"00:00";const dd=datePart.split("-").map(Number),tt=timePart.split(":").map(Number);const y=dd[0]||1970,mo=dd[1]||1,d=dd[2]||1,h=tt[0]||0,mi=tt[1]||0;const wallAsUTC=Date.UTC(y,mo-1,d,h,mi);let instant=wallAsUTC;for(let i=0;i<3;i++){const next=wallAsUTC-cairoOffsetMs(new Date(instant));if(next===instant)break;instant=next}return new Date(instant).toISOString()}

function cairoDayMs(d){const parts=new Intl.DateTimeFormat("en-US",{timeZone:EXAM_TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);const g=t=>Number((parts.find(p=>p.type===t)||{}).value||0);return Date.UTC(g("year"),g("month")-1,g("day"))}

  // حِمل كل يوم: كام مادة بتتذاكر فيه (حدّ ناعم: مادتين في اليوم)
  const dayLoad=new Map();
  const segs=planned.map((exam)=>{
    const s=subs.find(x=>x.slug===exam.subject_slug);
    const c=counts(s.slug), total=c.v+c.r+c.f+c.s+c.q;
    const examDayMs=cairoDayMs(new Date(exam.exam_date));
    // عدد أيام المذاكرة المطلوب: على الأقل يومين لكل مادة، وبيزيد مع حجم المحتوى
    const desired=total===0?2:Math.min(10,Math.max(2,Math.ceil(total/6)));
    // الأيام المرشحة: من النهاردة لحد قبل يوم المراجعة، من الأقرب للامتحان للأبعد —
    // كده المادة اللي امتحانها قريب من اللي قبله بتسحب أيام مذاكرتها بدري
    // في الأيام الفاضية اللي قبلها بدل ما تضيع من غير مذاكرة
    const candidates=[];
    for(let d=examDayMs-2*DAY;d>=todayMs;d-=DAY){ if(!examDays.has(d))candidates.push(d); }
    const picked=[];
    for(const d of candidates){ if(picked.length>=desired)break; if((dayLoad.get(d)||0)<2)picked.push(d); }
    // ضمان: كل مادة تاخد أيامها المطلوبة حتى لو اليوم بقى فيه مادتين خلاص
    for(const d of candidates){ if(picked.length>=desired)break; if(!picked.includes(d))picked.push(d); }
    for(const d of picked)dayLoad.set(d,(dayLoad.get(d)||0)+1);
    picked.sort((a,b)=>a-b);
    const n=picked.length; let covered=0;
    const days=picked.map((d,idx)=>{
      const share=n>0?Math.floor(total/n)+(idx<total%n?1:0):0;
      const from=share>0?covered+1:0; covered+=share;
      return {dayMs:d,kind:"study",count:share,from,to:covered};
    });
    if(examDayMs-DAY>=todayMs)days.push({dayMs:examDayMs-DAY,kind:"revision",count:0,from:0,to:0});
    days.push({dayMs:examDayMs,kind:"exam",count:0,from:0,to:0});
    const breakdown=[["🎬",c.v,"فيديو"],["🎙️",c.r,"ريكورد"],["📁",c.f,"ملف"],["📝",c.s,"ملخص"],["❓",c.q,"سؤال"]].filter(x=>x[1]>0).map(x=>x[0]+" "+x[1]+" "+x[2]).join(" · ");
    const dayRow=d=>{
      const isPast=d.dayMs<todayMs, isToday=d.dayMs===todayMs;
      const titlePlain=d.kind==="exam"?("🎓 يوم الامتحان — "+exam.title)
        :d.kind==="revision"?("🔁 مراجعة سريعة — "+s.ar)
        :d.count>0?("ذاكر "+s.ar+" — 🎯 "+d.count+" عنصر")
        :total>0?("راجع "+s.ar+" — اللي فات وحل أسئلة")
        :("ذاكر "+s.ar+" من مصادرك");
      const title=esc(titlePlain);
      const sub=d.kind==="exam"?fmtExam(exam.exam_date)
        :d.kind==="revision"?"عدّي على أهم النقاط والملخصات والأسئلة — مراجعة خفيفة قبل الامتحان"
        :d.count>0?("العناصر من "+d.from+" لـ "+d.to+" من أصل "+total+" عنصر في المادة")
        :total>0?"مفيش عناصر جديدة في خطة النهاردة — يوم خفيف للمراجعة"
        :"لسه مفيش عناصر مضافة للمادة في المنصة — ذاكر من الكتاب ومصادرك";
      const examStyle=d.kind==="exam"?"background:var(--accent);color:#fff;border:0;":"";
      return `<button class="card" style="width:100%;text-align:right;display:block;margin-top:8px;${isPast?"opacity:.6;":""}${examStyle||""}${isToday&&d.kind!=="exam"?"border:2px solid var(--accent);":""}" onclick="openSubject('${s.slug}')" aria-label="${esc(titlePlain)} — ${esc(fmtDay(d.dayMs))}${isPast?" (عدّى)":isToday?" (النهاردة)":""} — افتح مادة ${esc(s.ar)}">
        <span style="font-size:12px;font-weight:900;color:${d.kind==="exam"?"rgba(255,255,255,.85)":"var(--accent)"}">${esc(fmtDay(d.dayMs))}</span>
        ${isToday?` <span class="pill" style="${d.kind==="exam"?"background:rgba(255,255,255,.2);color:#fff":"background:var(--accent);color:#fff"}">النهاردة</span>`:""}
        ${isPast?` <span class="pill">✓ عدّى</span>`:""}
        <div style="font-weight:900;margin-top:2px">${title}</div>
        <div class="meta" style="${d.kind==="exam"?"color:rgba(255,255,255,.85)":""}">${esc(sub)}</div>
      </button>`;
    };
    return `<div class="card">
      <div class="row"><span style="font-size:20px">${s.icon}</span><strong style="font-size:16px">${esc(s.ar)}</strong> <span class="pill">${EXAM_LABELS[exam.exam_type]||"📌 امتحان"}</span></div>
      <div class="meta" style="margin-top:2px">الامتحان: ${fmtExam(exam.exam_date)}</div>
      <div class="meta">${total>0?("محتوى المادة في المنصة: "+total+" عنصر — "+breakdown):"لسه مفيش محتوى مضاف للمادة دي في المنصة"}</div>
      ${days.map(dayRow).join("")}
    </div>`;
  });
  return `<section style="margin-top:20px"><h2 style="margin:0 0 4px">🗓️ خطة المذاكرة المقترحة</h2>
  <p class="meta" style="line-height:1.9">خطة يوم بيوم من النهاردة لحد آخر امتحان، متقسمة حسب عدد عناصر كل مادة الموجودة في المنصة فعلًا — كل مادة ليها أيام مذاكرة قبل امتحانها، ولو امتحانها قريب من اللي قبله بنبدأ مذاكرتها بدري في الأيام الفاضية، واليوم اللي قبل كل امتحان مراجعة سريعة. اضغط على أي يوم عشان تفتح المادة وتبدأ.</p>
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">${segs.join("")}</div></section>`;
}

  if(LIVE()&&sb){

    if(error){err.textContent="فشل الإرسال: "+error.message+" (جداول الأسئلة المجهولة بتتنشأ من قسم 10 في supabase-setup.sql)";return}
  } else {

  }

async function replyAnon(qid){

}

async function pushDetect(){
  try{
    if(!("Notification" in window)||!("PushManager" in window)||!("serviceWorker" in navigator)){pushState="unsupported";if(view.name==="home")render();return}
    if(Notification.permission==="denied"){pushState="denied";if(view.name==="home")render();return}
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    pushState=sub?"subscribed":"ready";
  }catch(e){pushState="unsupported"}
  if(view.name==="home")render();
}
async function subscribePushStatic(){
  if(!VAPID_PUBLIC_KEY){pushNote="صاحب الموقع لسه مفعّلش الإشعارات (مفتاح VAPID مش محطوط) — جرّب تاني قريب";render();return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){pushState=perm==="denied"?"denied":"ready";render();return}
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Static(VAPID_PUBLIC_KEY)});
    const j=sub.toJSON();
    if(LIVE()&&sb&&j.endpoint&&j.keys){
      const ins=await sb.from("push_subscriptions").insert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth});
      if(ins.error&&!/duplicate|unique/i.test(ins.error.message))pushNote="اتفعّلت على الجهاز بس حفظ الاشتراك فشل: "+ins.error.message+" (جدول الاشتراكات بيتنشأ من قسم 18 في supabase-setup.sql)";
    }

  }catch(e){pushNote="مقدرناش نفعّل الإشعارات — تأكد إنك فاتح الموقع من المتصفح ومثبّته على الشاشة الرئيسية"}

}
async function unsubscribePushStatic(){

async function sendPushStatic(){

  const title=document.getElementById("push-title").value.trim();
  const body=document.getElementById("push-body").value.trim();
  if(!title||!body){err.textContent="اكتب عنوان الإشعار ونصه الأول";return}
  if(!(LIVE()&&sb)){err.textContent="إرسال الإشعارات محتاج Supabase مفعّل في الموقع";return}
  if(!session){err.textContent=WRITE_SESSION_MSG;return}
  if(!(await askConfirm("إرسال الإشعار «"+title+"» لكل الطلاب المشتركين؟",{label:"📣 إرسال",danger:false})))return;
  err.textContent="بيبعت...";
  const postPush=async(token)=>await fetch(SUPABASE_URL+"/functions/v1/send-push",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,"apikey":SUPABASE_ANON_KEY},body:JSON.stringify({title,body})});

    // وبتتحدّث بـ onAuthStateChange) — من غير استدعاء getSession() تاني،
    // لأنه كان ممكن يرمي استثناء على سفاري الآيفون رغم إن الجلسة موجودة.
    let res=await postPush(session.access_token);

      // وبعدين أعد محاولة الإرسال مرة واحدة بالتوكن الجديد.
      const {data:rd,error:rerr}=await sb.auth.refreshSession();

    }

      const t=await res.text().catch(()=>"");
      err.textContent="فشل الإرسال — السيرفر رد بـ ("+res.status+")"+(t?": "+t.slice(0,200):"");
      return;
    }
    const j=await res.json();

async function adminUnlock(){
  const code=document.getElementById("admin-code").value.trim();
  const err=document.getElementById("login-err");
  if(!code){err.textContent="اكتب الكود الأول";return}
  if(!sb){err.textContent="التحقق بيتم من السيرفر واتصال Supabase مش جاهز — جرّب من صفحة أدمن المنصة الرئيسية";return}
  err.textContent="بيتحقق من الكود...";
  const {data,error}=await sb.rpc("check_admin_code",{candidate:code});
  if(error){err.textContent="التحقق لسه مش متفعل في Supabase — نفّذ قسم 6 من ملف supabase-setup.sql في SQL Editor";return}
  if(data!==true){err.textContent="الكود غير صحيح — الأدمن مش هيتفتح";return}
  /* الكود صح — الخطوة اللي كانت ناقصة وخلّت الكتابة تقف على «سجّل دخول
     الأدمن الأول»: إنشاء جلسة Supabase Auth لحساب الأدمن المشترك
     تلقائيًا، لأن سياسات RLS بتقصر الكتابة على دور authenticated.
     الإيميل بييجي من دالة admin_signin_email (قسم 12 — بترجّعه بس لو
     الكود صح)، وباسورد الحساب مضبوطة على السيرفر على نفس قيمة الكود
     (مزامنة قسم 12)، فالأدمن بيدخل بالكود بس من غير أي خطوة زيادة،
     ومفيش أي سر مكتوب في الملف ده. لو التفعيل لسه ما اتعملش في
     Supabase، الأدمن بيفتح للعرض وبانر اللوحة بيشرح خطوة التفعيل. */
  err.textContent="الكود صح ✓ — بيتم تفعيل جلسة الكتابة...";
  const em=await sb.rpc("admin_signin_email",{candidate:code});
  if(!em.error&&em.data){
    const si=await sb.auth.signInWithPassword({email:em.data,password:code});
    if(!si.error&&si.data&&si.data.session)session=si.data.session;
  }
  adminUnlocked=true;
  render();
}

/* ---------------- رفع ملف/صورة من جهاز الأدمن ----------------
   الملف بيترفع على Supabase Storage (باكت sahli-files العام للقراءة،
   والكتابة فيه للأدمن المسجّل بس — قسم 13 في supabase-setup.sql)،
   واللينك العام اللي بيرجع بيتحط تلقائيًا في خانة رابط المحتوى أو
   لينك صورة السؤال. الرفع بيستخدم نفس جلسة الأدمن اللي بتتعمل
   تلقائيًا بعد إدخال الكود — مفيش أي خطوة دخول زيادة. */
const STORAGE_BUCKET="sahli-files";
let uploadBusy=false;
async function uploadToStorage(file,statusEl){
  if(!LIVE()||!sb){statusEl.textContent="الرفع محتاج اتصال Supabase مفعّل في النسخة دي";return null}
  if(!session){statusEl.textContent=WRITE_SESSION_MSG;return null}
  uploadBusy=true; statusEl.textContent="بيرفع الملف...";
  const safe=file.name.replace(/[^\w.\-]+/g,"_").slice(-80)||"file";
  const path="uploads/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+safe;
  const up=await sb.storage.from(STORAGE_BUCKET).upload(path,file,{upsert:false});
  uploadBusy=false;
  if(up.error){statusEl.textContent="فشل الرفع: "+up.error.message+" — تأكد إن قسم 13 من ملف supabase-setup.sql اتنفذ مرة واحدة في Supabase (بيعمل باكت التخزين وسياساته)";return null}
  return sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

}

/* ---------------- رفع جماعي للصور ----------------
   الأدمن يختار أي عدد من الصور مرة واحدة (٢٠ أو أكتر — مفيش حد أقصى
   لعدد الصور في المرة الواحدة)، فتترفع واحدة ورا التانية على باكت
   sahli-files وكل صورة بتتضاف كعنصر لوحدها بصيغة «صور» وعنوانها اسم
   الصورة، في المادة والقسم (محاضرة/سكشن) المختارين في النموذج. */
async function adminBulkImagesChosen(input){
  const files=input.files?Array.from(input.files):[]; input.value=""; if(!files.length)return;
  const st=document.getElementById("a-bulk-status");
  if(!LIVE()||!sb){st.textContent="الرفع الجماعي محتاج اتصال Supabase مفعّل في النسخة دي";return}
  if(!session){st.textContent=WRITE_SESSION_MSG;return}
  const d=collect();
  let added=0; const failed=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    st.textContent="بيرفع صورة "+(i+1)+" من "+files.length+": "+f.name;
    const url=await uploadToStorage(f,st);
    if(!url){failed.push(f.name);continue}
    const row=rowForDb({kind:d.kind,subject_slug:d.subject_slug,title:f.name.replace(/\.[^.]+$/,""),url:url,file_type:"صور",file_category:d.file_category||"lecture",description:null,question_text:null,answer_text:null,topic:null,image_url:null});
    const res=await sb.from(TABLE_FOR_KIND[d.kind]).insert(row);
    if(res.error){failed.push(f.name);continue}
    added++;
  }
  if(added>0)logActivity("add",d.kind,d.subject_slug,"رفع جماعي: "+added+" صورة");
  const msg="خلص الرفع الجماعي ✓ اتضافت "+added+" صورة من أصل "+files.length+(failed.length?(" — وفشل "+failed.length+": "+failed.slice(0,5).join("، ")):"");
  await fetchAllLive(); render();
  const st2=document.getElementById("a-bulk-status"); if(st2)st2.textContent=msg;
}

function rowForDb(d){
  /* الكتابة بنفس أعمدة الجداول الحية: subject_id (uuid) وأسئلة question/answer.
     الحقول النصية الاختيارية (الشرح/الملاحظة، الموضوع، لينك الصورة، نوع
     الملف) بتتبعت كنص فاضي "" مش null: جداول Supabase الحية اتعملت أصلًا
     بأعمدة NOT NULL (مثل videos.description)، فبعت null لما الأدمن يسيب
     «شرح / ملاحظة» فاضي كان بيوقع الحفظ كله برسالة
     «null value in column "description" violates not-null constraint». */
  const txt=v=>(v===null||v===undefined)?"":v;
  const sid=subjectIdBySlug[d.subject_slug]||null;
  /* ترتيب العرض (قسم 17): بيتحط في الصف بس لو محسوب — عشان الإضافة
     ما تقعش لو القسم لسه ما اتنفذش في المشروع الحي */
  const so=(typeof d.sort_order==="number")?{sort_order:d.sort_order}:{};
  if(d.kind==="video"){const tg=tgPost(d.url);return {subject_id:sid,title:d.title,url:tg?("https://t.me/"+tg):d.url,description:txt(d.description),...so}}
  if(d.kind==="recording")return {subject_id:sid,title:d.title,url:d.url,file_category:d.file_category||"lecture",description:txt(d.description),...so};
  if(d.kind==="file"||d.kind==="summary")return {subject_id:sid,title:d.title,url:d.url,file_type:txt(d.file_type),file_category:d.file_category||"lecture",description:txt(d.description),...so};
  return {subject_id:sid,question:d.question_text,answer:txt(d.answer_text),topic:txt(d.topic),image_url:txt(d.image_url),description:txt(d.description),...so};
}
async function saveItem(){
  const d=collect(),err=document.getElementById("a-err");
  if(uploadBusy){err.textContent="استنى لما رفع الملف يخلص الأول";return}
  if(d.kind==="video"&&(!d.title||!d.url)){err.textContent="اكتب عنوان الفيديو ورابطه";return}
  if(d.kind==="recording"&&(!d.title||!d.url)){err.textContent="اكتب عنوان الريكورد وحط رابطه أو ارفع ملف الصوت";return}
  if(d.kind==="file"&&!d.title){err.textContent="اكتب عنوان الملف";return}
  if(d.kind==="summary"&&!d.title){err.textContent="اكتب عنوان الملخص";return}
  if(d.kind==="question"&&(!d.question_text||!d.answer_text)){err.textContent="اكتب السؤال والإجابة";return}
  /* العنصر الجديد بياخد أول ترتيب العرض في مجموعته (مادة + نوع + محاضرة/سكشن) */
  if(!editing){
    const src=LIVE()?published:localItems();
    const cat=d.file_category||"lecture";
    const mins=src.filter(x=>x.subject_slug===d.subject_slug&&x.kind===d.kind&&(x.file_category||"lecture")===cat).map(ordOf);
    d.sort_order=(mins.length?Math.min(...mins):0)-1;
  }
  if(LIVE()){
    if(!session){err.textContent=WRITE_SESSION_MSG;return}
    err.textContent="بيحفظ في Supabase...";
    const table=TABLE_FOR_KIND[editing?editing.kind:d.kind];
    let res=editing
      ? await sb.from(table).update(rowForDb(d)).eq("id",editing.id)
      : await sb.from(TABLE_FOR_KIND[d.kind]).insert(rowForDb(d));
    /* لو قسم 17 (عمود sort_order) لسه ما اتنفذش في المشروع الحي، إعادة
       المحاولة من غير العمود عشان الإضافة نفسها ما تقعش */
    if(res.error&&!editing&&/sort_order/.test(res.error.message||"")){
      const row=rowForDb(d); delete row.sort_order;
      res=await sb.from(TABLE_FOR_KIND[d.kind]).insert(row);
    }
    if(res.error){err.textContent="فشل الحفظ: "+res.error.message;return}
    logActivity(editing?"update":"add",d.kind,d.subject_slug,d.kind==="question"?d.question_text:d.title);
    /* إضافة ناجحة = مسودة النوع + المادة دي بتتمسح (التعديل ما بيلمسش المسودات) */
    if(!editing){try{localStorage.removeItem("sahli-draft:"+d.kind+":"+d.subject_slug)}catch(e){}}
    editing=null; await fetchAllLive(); render(); return;
  }
  let items=localItems();
  if(editing){items=items.map(i=>(i.kind===editing.kind&&String(i.id)===String(editing.id))?{...i,...d}:i);logActivity("update",d.kind,d.subject_slug,d.kind==="question"?d.question_text:d.title);editing=null}
  else {items.unshift({id:Date.now(),created_at:new Date().toISOString(),...d});logActivity("add",d.kind,d.subject_slug,d.kind==="question"?d.question_text:d.title);try{localStorage.removeItem("sahli-draft:"+d.kind+":"+d.subject_slug)}catch(e){}}
  saveLocal(items);render();
}

   بيتكتب (debounce ~300ms) بمفتاح لكل نوع + مادة

   قبل ما يدوس «إضافة» يرجع يلاقي كلامه زي ما هو. المسودة بتتمسح

   لصفحة الأدمن، وتبديل النوع/المادة/السيمستر بيحمّل مسودة التركيبة
   الجديدة فورًا (أو يفضّي النموذج) عشان المسودات ما تختلطش. */
let draftTimer=null, subjectDraftTimer=null, annDraftTimer=null;
const DRAFT_FIELD_IDS=["a-title","a-url","a-type","a-filecat","a-desc","a-q","a-answer","a-topic","a-img"];
function draftEl(id){return document.getElementById(id)}
function currentDraftKey(){

function collectDraft(){

function draftIsEmptyD(d){return !d.title&&!d.url&&!d.description&&!d.questionText&&!d.answerText&&!d.topic&&!d.imageUrl&&d.fileType==="PDF"&&d.fileCategory==="lecture"}
function saveContentDraftNow(){

function restoreAdminDrafts(){
  if(editing)return;
  /* آخر اختيار (سيمستر/مادة/نوع) عشان مسودة النوع والمادة اللي
     الأدمن كان واقف عليهم تتحمّل على طول أول ما يفتح صفحة الأدمن */
  const last=lsGet("sahli-draft:last",null);
  const semSel=draftEl("a-semester"),subSel=draftEl("a-subject"),kindSel=draftEl("a-kind");
  if(last&&semSel&&subSel&&kindSel){
    if([...semSel.options].some(o=>o.value===last.semesterSlug)){semSel.value=last.semesterSlug;fillSubjects()}
    if([...subSel.options].some(o=>o.value===last.subjectSlug))subSel.value=last.subjectSlug;
    if([...kindSel.options].some(o=>o.value===last.kind)){kindSel.value=last.kind;kindChanged()}
  }
  applyContentDraft();
  /* مسودة نموذج إضافة مادة */
  const sd=lsGet("sahli-draft:new-subject",null);
  if(sd){
    const ss=draftEl("sub-semester"); if(ss&&[...ss.options].some(o=>o.value===sd.semester))ss.value=sd.semester;
    const sa=draftEl("sub-ar"); if(sa)sa.value=sd.nameAr||"";
    const se=draftEl("sub-en"); if(se)se.value=sd.nameEn||"";
    const si=draftEl("sub-icon"); if(si)si.value=sd.icon||"📘";
  }
  /* مسودة نص الإعلام — annPending (نص مستني تأكيد النشر) ليه الأولوية */
  if(annPending===null){
    let ad=null; try{ad=localStorage.getItem("sahli-draft:announcement")}catch(e){}
    const at=draftEl("ann-text"); if(at&&ad)at.value=ad;
  }
}

async function moveItem(kind,id,dir){
  const src=LIVE()?published:localItems();
  const it=src.find(x=>x.kind===kind&&String(x.id)===String(id)); if(!it)return;
  const cat=it.file_category||"lecture";
  const group=src.filter(x=>x.subject_slug===it.subject_slug&&x.kind===kind&&(x.file_category||"lecture")===cat).sort(byDisplayOrder);
  const idx=group.findIndex(x=>x.kind===kind&&String(x.id)===String(id));
  const swap=dir==="up"?idx-1:idx+1;
  if(idx<0||swap<0||swap>=group.length)return;
  const reordered=[...group]; const mv=reordered.splice(idx,1)[0]; reordered.splice(swap,0,mv);
  reordered.forEach((x,pos)=>{x.sort_order=(pos+1)*10});
  if(LIVE()){
    if(!session){alert(WRITE_SESSION_MSG);return}
    const table=TABLE_FOR_KIND[kind];
    for(const x of reordered){
      const {error}=await sb.from(table).update({sort_order:x.sort_order}).eq("id",x.id);
      if(error){alert("فشل حفظ الترتيب: "+error.message+" — لو دي أول مرة تستخدم الترتيب، نفّذ قسم 17 من ملف supabase-setup.sql في SQL Editor مرة واحدة وبعدين جرّب تاني.");return}
    }
    logActivity("move",kind,it.subject_slug,kind==="question"?it.question_text:it.title);
    await fetchAllLive(); render(); return;
  }
  const all=localItems().map(x=>{const g=reordered.find(r=>r.kind===x.kind&&String(r.id)===String(x.id));return g?{...x,sort_order:g.sort_order}:x});
  saveLocal(all);
  logActivity("move",kind,it.subject_slug,kind==="question"?it.question_text:it.title);
  render();
}

/* ---------------- رفع محتوى يدوي من جهاز الزائر (شارك وساعد) ----------------
   الزائر يختار ملف من جهازه (محتوى للمصدر المقترح أو صورة لسؤال) فيترفع
   على Supabase Storage في مجلد «suggestions/» جوه باكت sahli-files،
   واللينك العام اللي بيرجع بيتحط تلقائيًا في خانة اللينك أو لينك صورة
   السؤال — من غير ما الزائر يلصق أي لينك خارجي. الرفع بيتم بالمفتاح
   القابل للنشر (anon) من غير أي تسجيل دخول، وسياسة التخزين بتسمح
   للزوار بالإدراج في مجلد suggestions/ بس (قسم 16 في
   supabase-setup.sql) — مفيش تعديل ولا حذف للزوار، والقراءة عامة
   أصلًا من قسم 13. الاقتراح نفسه بيتبعت بعد كده للأدمن للمراجعة. */
const VISITOR_MAX_UPLOAD_BYTES=12*1024*1024;
async function visitorUploadToStorage(file,statusEl){
  if(!LIVE()||!sb){statusEl.textContent="الرفع محتاج اتصال Supabase مفعّل في النسخة دي — حط لينك للمحتوى بدل الرفع";return null}
  if(file.size>VISITOR_MAX_UPLOAD_BYTES){statusEl.textContent="حجم الملف أكبر من ١٢ ميجا — ارفع ملف أصغر أو حط لينك خارجي للملف";return null}
  statusEl.textContent="بيرفع الملف...";
  const safe=file.name.replace(/[^\w.\-]+/g,"_").slice(-80)||"file";
  const path="suggestions/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+safe;
  const up=await sb.storage.from(STORAGE_BUCKET).upload(path,file,{upsert:false});
  if(up.error){statusEl.textContent="فشل الرفع: "+up.error.message+" — تأكد إن قسم 16 من ملف supabase-setup.sql اتنفذ مرة واحدة في Supabase (بيسمح للزوار بالرفع في مجلد الاقتراحات)";return null}
  return sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

async function sendSuggestion(slug){
  const k=document.getElementById("sg-kind").value, err=document.getElementById("sg-err");
  const d={subject_slug:slug,kind:k,
    title:document.getElementById("sg-title").value.trim(),
    url:document.getElementById("sg-url").value.trim()||null,
    question_text:k==="question"?document.getElementById("sg-q").value.trim():null,
    answer_text:k==="question"?document.getElementById("sg-a").value.trim():null,
    topic:k==="question"?document.getElementById("sg-topic").value.trim()||null:null,
    image_url:k==="question"?document.getElementById("sg-img").value.trim()||null:null,
    file_category:(k==="file"||k==="recording"||k==="summary")?document.getElementById("sg-filecat").value:null,
    suggester_name:document.getElementById("sg-name").value.trim()};
  if(k==="video"&&(!d.title||!d.url)){err.textContent="اكتب عنوان الفيديو ورابطه";return}
  if(k==="recording"&&(!d.title||!d.url)){err.textContent="اكتب عنوان الريكورد ورابطه";return}
  if(k==="file"&&!d.title){err.textContent="اكتب عنوان الملف";return}
  if(k==="summary"&&!d.title){err.textContent="اكتب عنوان الملخص";return}
  if(k==="question"&&(!d.question_text||!d.answer_text)){err.textContent="اكتب السؤال والإجابة";return}
  if(LIVE()&&sb){
    const {error}=await sb.from("suggestions").insert({subject_id:subjectIdBySlug[slug]||null,subject_slug:slug,kind:k,title:k==="question"?"":d.title,url:d.url,file_category:d.file_category||"lecture",question:d.question_text||"",answer:d.answer_text||"",topic:d.topic||"",image_url:d.image_url||"",suggester_name:d.suggester_name});

},10000);
/* ---------------- عدّاد وقت المذاكرة (محلي على جهاز الطالب) ---------------- */
function studyLoad(){try{const v=JSON.parse(localStorage.getItem("sahli-study-time")||"{}");return {total:v.total||0,days:v.days||{}}}catch(e){return {total:0,days:{}}}}
function studySave(d){try{localStorage.setItem("sahli-study-time",JSON.stringify(d))}catch(e){}}
function dayKeyOf(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function streakOf(days){let n=0;const d=new Date();if(!days[dayKeyOf(d)])d.setDate(d.getDate()-1);while((days[dayKeyOf(d)]||0)>0){n++;d.setDate(d.getDate()-1)}return n}
function fmtDur(sec){const m=Math.floor(sec/60);if(m<1)return "أقل من دقيقة";if(m<60)return m+" دقيقة";const h=Math.floor(m/60);return m%60?(h+" ساعة و"+(m%60)+" دقيقة"):(h+" ساعة")}
function encourageMsg(sec){const m=sec/60;if(m>=120)return "أسطورة! ساعتين مذاكرة 🏆";if(m>=60)return "وحش! ساعة كاملة 🔥";if(m>=30)return "برافو، كمل 👏";if(m>=15)return "عاش، بداية قوية 💪";return "ركّز وابدأ — كل دقيقة بتفرق 🎯"}
let studyExpanded=false;
let studyHidden=false; try{studyHidden=localStorage.getItem("sahli-study-hidden")==="1"}catch(e){}
function studySetHidden(v){studyHidden=v; if(v)studyExpanded=false; try{if(v)localStorage.setItem("sahli-study-hidden","1");else localStorage.removeItem("sahli-study-hidden")}catch(e){} studyChipRender()}
function studyChipRender(){
  let chip=document.getElementById("study-chip");
  /* الكبسولة جوّه تدفق الصفحة في أول المحتوى (sticky فوق) — ليها مكانها
     المحجوز في التخطيط فمبتغطيش أي محتوى أبدًا، وبتفضل باينة وهي
     بتتحرك مع التمرير من مكانها الطبيعي. render() بيعيد بناء #app كل
     مرة فبينادي studyChipRender بعده عشان الكبسولة ترجع لمكانها. */
  if(!chip){chip=document.createElement("div");chip.id="study-chip";chip.style.cssText="position:sticky;top:8px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-bottom:10px";$app.insertBefore(chip,$app.firstChild)}
  const d=studyLoad(), today=d.days[dayKeyOf()]||0, pct=Math.min(100,Math.round(today/3600*100)), streak=streakOf(d.days);
  if(studyHidden){
    chip.innerHTML=`<button aria-label="إظهار عداد وقت المذاكرة" onclick="studySetHidden(false)" style="width:36px;height:36px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--dim);font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer">⏱</button>`;
    return;
  }
  chip.innerHTML=(studyExpanded?`<div class="card" style="width:280px;box-shadow:0 8px 24px rgba(0,0,0,.18)">
      <strong>⏱ وقت مذاكرتي</strong>
      <p style="margin:8px 0;font-weight:800">${encourageMsg(today)}</p>
      <div class="meta">📅 النهاردة: <b>${fmtDur(today)}</b></div>
      <div class="meta">🕰 الإجمالي: <b>${fmtDur(d.total)}</b></div>
      <div class="meta">🔥 سلسلة الأيام: <b>${streak}</b></div>
      <div class="meta" style="margin-top:8px">هدف النهاردة: ساعة مذاكرة — ${pct}٪</div>
      <div style="height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:99px"></div></div>
      <p class="meta" style="margin-top:8px">العداد بيعدّ بس والموقع مفتوح والتبويب ظاهر قدامك. الوقت محفوظ على الجهاز ده بس — لو فتحت من جهاز تاني أو مسحت بيانات المتصفح، العداد هيبدأ من الصفر.</p>
      <button class="btn ghost" style="margin-top:8px;font-size:12px" onclick="studySetHidden(true)">إخفاء العداد</button>
    </div>`:"")
    +`<span style="display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:3px 4px 3px 12px;box-shadow:0 2px 8px rgba(0,0,0,.08)"><button aria-label="عداد وقت المذاكرة — اضغط للتفاصيل" onclick="studyExpanded=!studyExpanded;studyChipRender()" style="border:0;background:none;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">⏱ النهاردة: <b style="color:var(--text)">${fmtDur(today)}</b>${streak>1?` · <span style="color:var(--amber)">🔥 ${streak}</span>`:""}</button><button aria-label="إخفاء عداد وقت المذاكرة" onclick="studySetHidden(true)" style="width:24px;height:24px;border:0;border-radius:99px;background:none;color:var(--dim);font-size:11px;cursor:pointer">✕</button></span>`;
}
setInterval(()=>{
  if(document.visibilityState!=="visible")return;
  const d=studyLoad(), k=dayKeyOf();
  d.total+=5; d.days[k]=(d.days[k]||0)+5; studySave(d); studyChipRender();
},5000);
/* ---------------- أضف إلى الشاشة الرئيسية (PWA) ----------------
   أندرويد/كروم: الزرار يشغّل نافذة التثبيت الرسمية (beforeinstallprompt).
   آيفون/سفاري: مفيش تثبيت برمجي، فالزرار يعرض خطوات الإضافة اليدوية.
   الزرار بيختفي لو الموقع متثبّت أصلًا (display-mode: standalone). */
let deferredInstallPrompt=null;
const appIsStandalone=()=>{try{return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true}catch(e){return false}};
const deviceIsIOS=()=>{const ua=navigator.userAgent||"";return /iphone|ipad|ipod/i.test(ua)||(ua.includes("Macintosh")&&"ontouchend"in document)};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;refreshInstallBtn()});
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;refreshInstallBtn()});
function refreshInstallBtn(){const b=document.getElementById("install-btn");if(b)b.style.display=appIsStandalone()?"none":""}
async function installApp(){
  if(deferredInstallPrompt){
    try{await deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice}catch(e){}
    deferredInstallPrompt=null; refreshInstallBtn(); return;
  }
  showInstallSteps();
}
function showInstallSteps(){
  let ov=document.getElementById("install-steps");
  if(!ov){ov=document.createElement("div");ov.id="install-steps";document.body.appendChild(ov)}
  const steps=deviceIsIOS()
    ? `<li>افتح الموقع في متصفح <b>سفاري</b>.</li><li>اضغط زرار <b>المشاركة</b> (المربع اللي فيه سهم طالع لفوق) تحت في سفاري.</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b> من القائمة.</li><li>اضغط <b>«إضافة»</b> — هتلاقي أيقونة سهّلي فيزيو على شاشتك وبتفتح زي التطبيقات.</li>`
    : `<li>افتح قائمة المتصفح <b>⋮</b> من فوق.</li><li>اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</li><li>أكّد الإضافة — هتلاقي أيقونة سهّلي فيزيو على شاشتك وبتفتح زي التطبيقات.</li>`;
  ov.innerHTML=`<div style="position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px" onclick="if(event.target===this)document.getElementById('install-steps').style.display='none'">
    <div class="card" style="max-width:440px;width:100%;margin:0">
      <h3>📲 أضف سهّلي فيزيو إلى الشاشة الرئيسية</h3>
      <ol style="padding-inline-start:22px;line-height:2;font-weight:700;color:var(--dim)">${steps}</ol>
      <button class="btn" style="width:100%" onclick="document.getElementById('install-steps').style.display='none'">تمام، فهمت</button>
    </div></div>`;
  ov.style.display="";
}
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  /* لو نسخة أحدث من الـ Service Worker سيطرت على الصفحة المفتوحة (بعد
     تحديث الموقع)، نعيد التحميل مرة واحدة بس عشان الطالب يشوف الجديد
     من غير ريفريش يدوي — والحارس بيمنع إعادة التحميل عند أول تثبيت */
  const hadController=!!navigator.serviceWorker.controller;
  let swReloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!hadController||swReloaded)return; swReloaded=true; location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      /* أول ما النت يرجع نسأل عن تحديث للـ Service Worker نفسه */
      window.addEventListener("online",()=>{reg.update().catch(()=>{})});
    }).catch(()=>{});
  });
}
studyChipRender();
/* رسم فوري لهيكل الصفحة مع هياكل تحميل (skeleton) في الأقسام اللي بتستنى
   بيانات — أول عرض بيظهر على طول بدل صفحة فاضية أو حالات «لسه مفيش»
   وأصفار، و load() بترسم من جديد بالبيانات الحقيقية أول ما توصل */
render();
load();
pushDetect();
</script>
